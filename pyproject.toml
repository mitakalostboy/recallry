[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recallry"
version = "0.1.0"
description = "Persistent, verified knowledge for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
recallry = "recallry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["recallry*"]

[tool.setuptools.package-data]
recallry = ["resources/config.toml", "resources/templates/*.md"]
